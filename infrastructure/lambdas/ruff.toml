# Lint config for the Python Lambdas (CI: .github/workflows/test-lambdas.yml).
target-version = "py312"   # matches the Lambda runtime / setup-python-lambdas.sh

[lint]
# Ruff's defaults, written out so changes are deliberate: pyflakes (F) + pycodestyle errors (E4/E7/E9).
# F841 (unused local variable) is what catches the clerk_authorizer `route_key` class of bug.
select = ["E4", "E7", "E9", "F"]
