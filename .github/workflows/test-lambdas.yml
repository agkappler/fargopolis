# No AWS credentials needed — infrastructure/lambdas' tests mock DynamoDB with moto, no network
# or real AWS access. See infrastructure/lambdas/README.md for what's tested and how to run
# locally (same script + npm command this workflow uses).

name: Test Lambdas

on:
  pull_request:
    paths:
      - 'infrastructure/lambdas/**'
      - 'scripts/setup-python-lambdas.sh'
      - '.github/workflows/test-lambdas.yml'
  push:
    branches: [main]
    paths:
      - 'infrastructure/lambdas/**'
      - 'scripts/setup-python-lambdas.sh'
      - '.github/workflows/test-lambdas.yml'

concurrency:
  group: test-lambdas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: infrastructure/lambdas/requirements-dev.txt

      - name: Install Lambda test dependencies
        run: ./scripts/setup-python-lambdas.sh

      - name: Run pytest
        working-directory: infrastructure
        run: npm run test
