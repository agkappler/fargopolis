# Gates PRs that touch infrastructure/ on a TypeScript compile + `cdk synth` — those only ran
# implicitly on push to main as part of `deploy-api-stack.yml`, so a broken construct could merge
# silently and only surface as a failed production deploy. `cdk synth` needs no AWS credentials;
# Python Lambda bundling runs in Docker (preinstalled on ubuntu-latest runners), not local Python.

name: Test Infrastructure

on:
  pull_request:
    paths:
      - 'infrastructure/**'
      - '.github/workflows/test-infrastructure.yml'
  push:
    branches: [main]
    paths:
      - 'infrastructure/**'
      - '.github/workflows/test-infrastructure.yml'

concurrency:
  group: test-infrastructure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synth:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: infrastructure

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infrastructure/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: CDK synth
        run: npx cdk synth --all
