# Required repo secrets:
#   AWS_REGION
#   AWS_API_DEPLOY_ROLE_TO_ASSUME — IAM role ARN from FargopolisApi output GithubActionsApiDeployRoleArn
#
# Optional repo secret (for custom API Gateway domain mapping; omit for execute-api URLs only):
#   CDK_API_DOMAIN_JSON — single-line/minified JSON matching context.apiDomain
#     (domainName, hostedZoneDomain, hostedZoneId, certificateArn, createDnsRecord).
#
# This workflow deploys the CDK API stack (FargopolisApi) via GitHub OIDC.

name: Deploy API stack (CDK)

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/**'
      - '.github/workflows/deploy-api-stack.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api-stack
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: infrastructure

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infrastructure/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_API_DEPLOY_ROLE_TO_ASSUME }}
          role-session-name: github-actions-fargopolis-api-deploy
          aws-region: ${{ secrets.AWS_REGION }}

      # Pass apiDomain JSON without shell-quote bugs (JSON contains "); use Python subprocess argv.
      - name: CDK deploy FargopolisApi
        env:
          CDK_API_DOMAIN_JSON: ${{ secrets.CDK_API_DOMAIN_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${CDK_API_DOMAIN_JSON:-}" ]; then
            python3 -c "import json,os,subprocess;d=json.loads(os.environ['CDK_API_DOMAIN_JSON']);subprocess.check_call(['npx','cdk','deploy','FargopolisApi','--require-approval','never','-c','apiDomain='+json.dumps(d)])"
          else
            npx cdk deploy FargopolisApi --require-approval never
          fi
