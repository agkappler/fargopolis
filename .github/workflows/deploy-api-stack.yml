# Required repo secrets:
#   AWS_REGION
#   AWS_API_DEPLOY_ROLE_TO_ASSUME — IAM role ARN from FargopolisApi output GithubActionsApiDeployRoleArn
#
# Deploys both prod CDK stacks (FargopolisApi, FargopolisFrontend) via GitHub OIDC whenever
# infrastructure changes land on main, so prod infra always matches main. Region and custom-domain
# config are committed in infrastructure/cdk.json; no extra secrets are needed. The site content
# itself is uploaded by deploy-static-frontend.yml.

name: Deploy CDK stacks

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/**'
      - '.github/workflows/deploy-api-stack.yml'
      - '.python-version'
  workflow_dispatch:

concurrency:
  group: deploy-api-stack
  # Queue, never cancel: cancelling mid-deploy leaves the next run waiting on an in-progress stack.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: infrastructure

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infrastructure/package-lock.json

      - name: Setup Python (pinned in .python-version)
        # CDK bundles the Python Lambdas locally with this interpreter (lib/python-lambda-bundling.ts),
        # so it never needs Docker or an image pull.
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_API_DEPLOY_ROLE_TO_ASSUME }}
          role-session-name: github-actions-fargopolis-api-deploy
          aws-region: ${{ secrets.AWS_REGION }}

      - name: CDK deploy FargopolisApi and FargopolisFrontend
        run: npx cdk deploy FargopolisApi FargopolisFrontend --require-approval never
